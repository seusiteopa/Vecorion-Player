[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/v/*"
  to = "/.netlify/functions/share"
  status = 200

[[redirects]]
  from = "/c/*"
  to = "/.netlify/functions/share"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://sdk.mercadopago.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://res.cloudinary.com; media-src https://res.cloudinary.com; connect-src 'self' https://*.supabase.co https://api.cloudinary.com https://api.mercadopago.com; frame-ancestors 'self'"
